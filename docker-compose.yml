services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.8
    container_name: rms-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --default-log-level=info
    ports:
      - "19092:19092"   # Kafka API (host)
      - "9092:9092"     # Kafka API (docker network)
      - "18081:18081"   # Schema Registry
      - "18082:18082"   # HTTP Proxy
      - "9644:9644"     # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - rms

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.8
    container_name: rms-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        BROKER=redpanda:9092
        RAW=$${KAFKA_TOPIC_RAW_TICKS:-raw-ticks}
        ENRICHED=$${KAFKA_TOPIC_ENRICHED_TICKS:-enriched-ticks}
        ALERTS=$${KAFKA_TOPIC_ALERTS:-alerts}
        DLQ=$${KAFKA_TOPIC_DLQ:-dlq}
        for topic in "$$RAW" "$$ENRICHED" "$$ALERTS" "$$DLQ"; do
          rpk topic create "$$topic" --brokers "$$BROKER" -p 3 -r 1 || true
        done
        echo "Redpanda topics ready: $$RAW $$ENRICHED $$ALERTS $$DLQ"
        rpk topic list --brokers "$$BROKER"
    environment:
      KAFKA_TOPIC_RAW_TICKS: ${KAFKA_TOPIC_RAW_TICKS:-raw-ticks}
      KAFKA_TOPIC_ENRICHED_TICKS: ${KAFKA_TOPIC_ENRICHED_TICKS:-enriched-ticks}
      KAFKA_TOPIC_ALERTS: ${KAFKA_TOPIC_ALERTS:-alerts}
      KAFKA_TOPIC_DLQ: ${KAFKA_TOPIC_DLQ:-dlq}
    networks:
      - rms
    restart: "no"

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: rms-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      CONFIG_FILEPATH: /etc/redpanda/console.yml
    volumes:
      - ./infra/redpanda/console.yml:/etc/redpanda/console.yml:ro
    ports:
      - "8080:8080"
    networks:
      - rms

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: rms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - rms

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-37Z
    container_name: rms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET:-market-lake} &&
      mc anonymous set none local/$${MINIO_BUCKET:-market-lake} &&
      echo 'MinIO bucket ready'
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-market-lake}
    networks:
      - rms
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: rms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-airflow} -d $${POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - rms

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: rms-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - rms

  grafana:
    image: grafana/grafana:11.3.0
    container_name: rms-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - rms

networks:
  rms:
    name: rms-net
    driver: bridge

volumes:
  redpanda-data:
  minio-data:
  postgres-data:
  prometheus-data:
  grafana-data:
