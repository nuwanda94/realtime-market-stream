[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "realtime-market-stream"
version = "0.1.0"
description = "Local-first real-time market data streaming platform (Redpanda + Delta on MinIO)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Karan Verma" }]
keywords = ["streaming", "kafka", "redpanda", "delta-lake", "market-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "kafka-python>=2.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
]
live = [
  "websockets>=12.0",
]
lakehouse = [
  "deltalake>=0.18",
  "pyarrow>=15",
]
query = [
  "duckdb>=1.0",
  "polars>=1.0",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]
dashboard = [
  "streamlit>=1.37",
]

[project.urls]
Homepage = "https://github.com/nuwanda94/realtime-market-stream"
Issues = "https://github.com/nuwanda94/realtime-market-stream/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/realtime_market_stream"]

[tool.hatch.build.targets.sdist]
include = [
  "src/realtime_market_stream",
  "README.md",
  "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "apps", "scripts"]
exclude = [
  ".venv",
  "build",
  "dist",
  "airflow/logs",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",   # pyupgrade
  "N",   # pep8-naming
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["realtime_market_stream"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["realtime_market_stream"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "integration: in-process pipeline tests (no broker required)",
  "broker: optional live Redpanda checks; skipped when unreachable",
]

[tool.coverage.run]
source = ["src/realtime_market_stream"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
