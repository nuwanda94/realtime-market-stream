# Local hooks that mirror CI (ruff + mypy + pytest).
# Install once:
#   make pre-commit-install
# or:
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# pre-commit stage: fast file hooks (whitespace, ruff, format)
# pre-push stage: full package typecheck + unit tests (matches CI lint/test)

default_language_version:
  python: python3.11

default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (package)
        additional_dependencies:
          - pydantic>=2.8
          - pydantic-settings>=2.4
        args: ["--config-file=pyproject.toml"]
        pass_filenames: false
        stages: [pre-commit, pre-push]

  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unit)
        entry: python -m pytest tests/unit -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
